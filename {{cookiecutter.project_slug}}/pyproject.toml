[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = {text = "MIT"}
authors = [{name = "{{ cookiecutter.author }}"}]

dependencies = [
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
dashboard = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]

[project.scripts]
{{ cookiecutter.project_slug }}-transform = "{{ cookiecutter.project_slug }}.cli:transform"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.project_slug }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Temporary: pinned to ruff's pre-0.17 default rules. ruff 0.17's wider
# defaults flag the blind `except Exception` blocks (BLE001) in
# apps/transform.py, which hide errors as zero counts; widen this once those
# handlers catch only the errors they expect.
select = ["E4", "E7", "E9", "F"]
